name: Publish Pre-release to NPM

on:
  # Auto-publish when PR is merged to next
  pull_request:
    types: [closed]
    branches:
      - next
  
  # Manual trigger for other branches
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to publish from'
        required: true
        default: 'next'

jobs:
  publish:
    # Only run if PR was merged (not just closed) OR manually triggered
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Determine branch to checkout
        id: branch_name
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Git checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.branch_name.outputs.name }}
          fetch-depth: 0

      - name: Verify checked out branch and show commit info
        run: |
          echo "=== Current Branch ==="
          git branch --show-current
          echo ""
          echo "=== Latest Commit ==="
          git log -1 --oneline
          echo ""
          echo "=== Working Directory ==="
          pwd
          ls -la

      - name: Determine version tag
        id: branch
        run: |
          BRANCH="${{ steps.branch_name.outputs.name }}"
          
          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          
          # Set version tag: 'bleeding-edge' for next branch, 'branchName-date-time' for others
          if [ "$BRANCH" == "next" ]; then
            echo "is_bleeding_edge=true" >> $GITHUB_OUTPUT
            echo "version_tag=bleeding-edge" >> $GITHUB_OUTPUT
          else
            echo "is_bleeding_edge=false" >> $GITHUB_OUTPUT
            echo "version_tag=$BRANCH-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Enable Corepack
        run: corepack enable
        shell: bash

      - name: Enable Yarn with Corepack
        run: corepack prepare yarn@stable --activate
        shell: bash

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Build packages
        run: yarn build

      - name: Verify build output
        run: |
          echo "=== Build Output for @rn-vui/base ==="
          ls -la packages/base/dist/ | head -20
          echo ""
          echo "=== Sample file content (first component) ==="
          find packages/base/dist -name "*.js" -type f | head -1 | xargs head -50
          echo ""
          echo "=== Build Output for @rn-vui/themed ==="
          ls -la packages/themed/dist/ | head -20

      - name: Configure NPM
        run: |
          npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          npm whoami

      - name: Publish packages to NPM
        id: publish
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.name }}"
          VERSION_TAG="${{ steps.branch.outputs.version_tag }}"
          
          for pkg in $(find ./packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n'); do
            echo "📦 Publishing @rn-vui/$pkg"
            
            cd packages/$pkg
            
            # Get current version from package.json
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            BASE_VERSION=$(echo $CURRENT_VERSION | sed 's/-.*$//')
            
            # Create prerelease version
            NEW_VERSION="${BASE_VERSION}-${VERSION_TAG}"
            
            echo "Version: $NEW_VERSION"
            echo "Current directory: $(pwd)"
            echo "Files to be published:"
            ls -la dist/ | head -10
            
            # Update package.json version
            npm version $NEW_VERSION --no-git-tag-version
            
            # Dry run first to see what will be published
            echo "=== Dry run output ==="
            npm publish --dry-run --tag test 2>&1 | grep -A 5 "package size"
            
            # Publish with appropriate tag
            if [ "${{ steps.branch.outputs.is_bleeding_edge }}" == "true" ]; then
              npm publish --tag bleeding-edge --access public
            else
              npm publish --tag $BRANCH_NAME --access public
            fi
            
            echo "✅ Published @rn-vui/$pkg@$NEW_VERSION"
            
            cd ../..
          done
          
          echo "published_version=${BASE_VERSION}-${VERSION_TAG}" >> $GITHUB_OUTPUT

      - name: Update documentation (bleeding-edge only)
        if: steps.branch.outputs.is_bleeding_edge == 'true'
        uses: ./.github/actions/install
        with:
          install_website: true

      - name: Build and deploy docs (bleeding-edge only)
        if: steps.branch.outputs.is_bleeding_edge == 'true'
        run: yarn docs-build

      - name: Deploy docs to gh-pages (bleeding-edge only)
        if: steps.branch.outputs.is_bleeding_edge == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          user_name: 'React Native vElements CI'
          user_email: 'react-native-elements-ci@users.noreply.github.com'
          cname: https://react-native-velements.thevikalp.com/

      - name: Comment on PR (if merged)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const versionTag = '${{ steps.branch.outputs.version_tag }}';
            const isBleedingEdge = '${{ steps.branch.outputs.is_bleeding_edge }}' === 'true';
            const version = '${{ steps.publish.outputs.published_version }}';
            
            let body = `🎉 Pre-release published to NPM! \n\n`;
            
            if (isBleedingEdge) {
              body += `**Version:** \`${version}\`\n\n**Install with:**\n\`\`\`bash\nnpm i @rn-vui/base@bleeding-edge @rn-vui/themed@bleeding-edge\n\`\`\`\n\n📚 **Documentation updated!**`;
            } else {
              const branch = '${{ steps.branch.outputs.name }}';
              body += `**Version:** \`${version}\`\n\n**Install with:**\n\`\`\`bash\nnpm i @rn-vui/base@${branch} @rn-vui/themed@${branch}\n\`\`\``;
            }
            
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
