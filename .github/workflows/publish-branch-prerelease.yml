name: Publish Branch Pre-release to NPM

on:
  # Manual trigger for any branch
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to publish from'
        required: true
        default: 'next'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Git checkout (initial)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Fetch and force checkout target branch
        run: |
          echo "=== Fetching all remotes ==="
          git fetch --all --prune
          
          BRANCH="${{ github.event.inputs.branch }}"
          echo "=== Target branch: $BRANCH ==="
          
          echo "=== Available remote branches ==="
          git branch -r | grep "$BRANCH" || echo "Branch not found in remotes!"
          
          echo "=== Checking out origin/$BRANCH ==="
          git checkout -B "$BRANCH" "origin/$BRANCH"
          
          echo "=== Force reset to remote tip ==="
          git reset --hard "origin/$BRANCH"
          
          echo "✅ Checkout complete"

      - name: Verify checked out branch and commit
        run: |
          echo "=== Git Status ==="
          git status
          echo ""
          echo "=== Current Branch/Ref ==="
          git rev-parse --abbrev-ref HEAD
          echo ""
          echo "=== Current Commit ==="
          git log -1 --format="%H %s"
          echo ""
          echo "=== Last 3 commits on this branch ==="
          git log -3 --oneline
          echo ""
          echo "=== Verifying working tree matches commit ==="
          if git diff-index --quiet HEAD --; then
            echo "✅ Working tree is clean and matches HEAD"
          else
            echo "❌ WARNING: Working tree has uncommitted changes!"
            git status --short
          fi

      - name: Enable Corepack
        run: corepack enable
        shell: bash

      - name: Enable Yarn with Corepack
        run: corepack prepare yarn@stable --activate
        shell: bash

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          skip_checkout: 'true'

      - name: Verify source code before build (optional check)
        continue-on-error: true
        run: |
          echo "=== Source code verification ==="
          echo "Current working directory: $(pwd)"
          echo "Git branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Git commit: $(git log -1 --oneline)"
          echo ""
          echo "Sample source files:"
          ls -la packages/base/src/Slider/ 2>/dev/null || echo "Slider directory not found"

      - name: Clean previous build
        run: |
          echo "Cleaning dist folders..."
          rm -rf packages/base/dist
          rm -rf packages/themed/dist
          echo "✅ Build folders cleaned"

      - name: Build packages
        run: yarn build

      - name: Verify build output
        run: |
          echo "=== Build Output for @rn-vui/base ==="
          ls -la packages/base/dist/ | head -20
          echo ""
          echo "=== Build Output for @rn-vui/themed ==="
          ls -la packages/themed/dist/ | head -20

      - name: Configure NPM
        run: |
          npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          npm whoami

      - name: Publish packages to NPM
        id: publish
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch }}"
          VERSION_TAG="$BRANCH_NAME-$(date +'%Y%m%d-%H%M')"
          
          for pkg in $(find ./packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n'); do
            echo "📦 Publishing @rn-vui/$pkg"
            
            cd packages/$pkg
            
            # Get current version from package.json
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            BASE_VERSION=$(echo $CURRENT_VERSION | sed 's/-.*$//')
            
            # Create prerelease version
            NEW_VERSION="${BASE_VERSION}-${VERSION_TAG}"
            
            echo "Version: $NEW_VERSION"
            echo "Current directory: $(pwd)"
            echo "Files to be published:"
            ls -la dist/ | head -10
            
            # Update package.json version
            npm version $NEW_VERSION --no-git-tag-version
            
            # Dry run first to see what will be published
            echo "=== Dry run output ==="
            npm publish --dry-run --tag test 2>&1 | grep -A 5 "package size"
            
            # Publish with branch name as tag
            npm publish --tag $BRANCH_NAME --access public
            
            echo "✅ Published @rn-vui/$pkg@$NEW_VERSION"
            
            cd ../..
          done
          
          echo "published_version=${BASE_VERSION}-${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## 🎉 Pre-release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.event.inputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.publish.outputs.published_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm i @rn-vui/base@${{ steps.publish.outputs.branch_name }} @rn-vui/themed@${{ steps.publish.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "or" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "yarn add @rn-vui/base@${{ steps.publish.outputs.branch_name }} @rn-vui/themed@${{ steps.publish.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
